[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afribase"
version = "0.3.0"
description = "The official Python SDK for Afribase — an open-source backend-as-a-service platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Afribase", email = "dev@useafribase.app" },
]
keywords = ["afribase", "baas", "supabase", "database", "auth", "realtime", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://useafribase.app"
Repository = "https://github.com/Altris-Product-Systems/Afribase-backend"
Documentation = "https://docs.useafribase.app/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["afribase"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff]
target-version = "py39"
line-length = 120
