name: Publish afribase (PyPI)

# Uses PyPI Trusted Publishing: no token is stored anywhere. Register this
# workflow once on pypi.org (project afribase -> Publishing -> add a GitHub
# publisher: owner Afribase-Dev, repo afribase-sdks, workflow
# publish-python.yml, environment pypi).
#
# Release: bump version in afribase-py/pyproject.toml, then push a tag
# py-<version>, or run this workflow by hand from main.

on:
  push:
    tags: ["py-*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afribase-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/py-')
        run: |
          want="${GITHUB_REF_NAME#py-}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$want" = "$have" ] || { echo "tag $want != pyproject $have"; exit 1; }
      - run: pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: afribase-py/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
